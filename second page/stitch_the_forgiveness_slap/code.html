            animation: bounce-slow 3s ease-in-out infinite;
        }

        @keyframes vibrate-subtle {
            0% { transform: translate(0.5px, 0.5px) rotate(0deg); }
            10% { transform: translate(-0.5px, -1px) rotate(-0.5deg); }
            20% { transform: translate(-1.5px, 0px) rotate(0.5deg); }
            30% { transform: translate(1.5px, 1px) rotate(0deg); }
            40% { transform: translate(0.5px, -0.5px) rotate(0.5deg); }
            50% { transform: translate(-0.5px, 1px) rotate(-0.5deg); }
            60% { transform: translate(-1.5px, 0.5px) rotate(0deg); }
            70% { transform: translate(1.5px, 0.5px) rotate(-0.5deg); }
            80% { transform: translate(-0.5px, -0.5px) rotate(0.5deg); }
            90% { transform: translate(0.5px, 1px) rotate(0deg); }
            100% { transform: translate(0.5px, -1px) rotate(-0.5deg); }
        .animate-vibrate-subtle {
            animation: vibrate-subtle 0.8s infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 4s linear infinite;

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const radioContainer = document.getElementById('radio-container');
        const radioImg = document.getElementById('radio-img');
        const audio = document.getElementById('bg-audio');
        
        const musicPlayer = document.getElementById('music-player');
        const cdImage = document.getElementById('cd-image');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlayPause = document.getElementById('icon-play-pause');
        const btnBack = document.getElementById('btn-back');
        const btnForth = document.getElementById('btn-forth');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        const popupModal = document.getElementById('popup-modal');
        const popupContent = document.getElementById('popup-content');
        const btnForgave = document.getElementById('btn-forgave');
        const btnDidntForgive = document.getElementById('btn-didnt-forgive');
        const popupButtons = document.getElementById('popup-buttons');
        const popupMessage = document.getElementById('popup-message');
        const btnGoBack = document.getElementById('btn-go-back');

        let isPlaying = false;
        let hasStarted = false;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showPopup() {
            popupModal.classList.remove('hidden');
            setTimeout(() => {
                popupModal.classList.remove('opacity-0');
                popupContent.classList.remove('scale-95');
            }, 10);
        }

        radioContainer.addEventListener('click', () => {
            if (!hasStarted) {
                // Initial click
                hasStarted = true;
                
                // Stop vibrate, add press effect
                radioImg.classList.remove('animate-vibrate-subtle');
                radioImg.classList.add('radio-press');
                setTimeout(() => radioImg.classList.remove('radio-press'), 150);

                // Show player
                musicPlayer.classList.remove('opacity-0');
                cdImage.classList.add('animate-spin-slow');

                // Play audio
                audio.play();
                isPlaying = true;
                cdImage.style.animationPlayState = 'running';
                iconPlayPause.textContent = 'pause';
            }
        });

        // Player Controls
        btnPlayPause.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                cdImage.style.animationPlayState = 'paused';
                iconPlayPause.textContent = 'play_arrow';
                showPopup();
            } else {
                audio.play();
                isPlaying = true;
                cdImage.style.animationPlayState = 'running';
                iconPlayPause.textContent = 'pause';
            }
        });

        btnBack.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.currentTime = Math.max(0, audio.currentTime - 10);
        });

        btnForth.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                timeCurrent.textContent = formatTime(audio.currentTime);
                progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            timeTotal.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            cdImage.style.animationPlayState = 'paused';
            iconPlayPause.textContent = 'play_arrow';
            showPopup();
        });

        progressContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        // Popup logic
        btnForgave.addEventListener('click', () => {
            popupButtons.classList.add('hidden');
            popupMessage.classList.remove('hidden');
            popupMessage.classList.add('flex');
        });

        btnGoBack.addEventListener('click', () => {
            popupMessage.classList.remove('flex');
            popupMessage.classList.add('hidden');
            popupButtons.classList.remove('hidden');
        });

        btnDidntForgive.addEventListener('click', () => {
            window.location.href = '../../3d page/stitch_the_forgiveness_slap/code.html';
        });
    });
</script></body></html>
