<script>
        document.addEventListener('DOMContentLoaded', () => {
            const slapTarget = document.getElementById('slap-target');
            const videoOverlay = document.getElementById('video-overlay');
            const videoContainer = document.getElementById('video-container');
            const slapVideo = document.getElementById('slap-video');
            
            if (slapTarget) {
                slapTarget.addEventListener('click', () => {
                    // Show video overlay
                    videoOverlay.classList.remove('hidden');
                    // Small delay to allow display:block to apply before transition
                    setTimeout(() => {
                        videoOverlay.classList.remove('opacity-0');
                        videoContainer.classList.remove('scale-95');
                    }, 10);

                    // Set starting time to 4 seconds
                    slapVideo.currentTime = 4;
                    slapVideo.play();
                });
            }

            // Monitor video time to stop at 6 seconds and redirect
            if (slapVideo) {
                slapVideo.addEventListener('timeupdate', () => {
                    if (slapVideo.currentTime >= 6) {
                        slapVideo.pause();
                        // Redirect to page 2
                        window.location.href = '../../second page/stitch_the_forgiveness_slap/code.html';
                    }
                });
            }
        });
    </script>
